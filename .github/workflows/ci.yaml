name: VTL 2.1 ANTLR Tools TS CI
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    id-token: write # Required for OIDC
    contents: read

jobs:
    check_if_version_upgraded:
        name: Check if version upgrade
        if: |
            github.event_name == 'push' ||
            github.event.pull_request.head.repo.owner.login == github.event.pull_request.base.repo.owner.login
        runs-on: ubuntu-latest
        outputs:
            from_version: ${{ steps.step1.outputs.from_version }}
            to_version: ${{ steps.step1.outputs.to_version }}
            is_upgraded_version: ${{ steps.step1.outputs.is_upgraded_version }}
            is_pre_release: ${{ steps.step1.outputs.is_pre_release }}
        steps:
            - uses: garronej/ts-ci@v2.1.0
              id: step1
              with:
                  action_name: is_package_json_version_upgraded
                  branch: ${{ github.head_ref || github.ref }}

    update_changelog:
        runs-on: ubuntu-latest
        needs: check_if_version_upgraded
        if: needs.check_if_version_upgraded.outputs.is_upgraded_version == 'true'
        permissions:
            contents: write
        steps:
            - uses: garronej/github_actions_toolkit@v2.2
              with:
                  action_name: update_changelog
                  branch: ${{ github.ref }}
                  commit_author_email: ts_ci@github.com

    publish_on_npm:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        needs:
            - update_changelog
            - check_if_version_upgraded
        concurrency:
            group: npm-publish-main
            cancel-in-progress: false
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.ref }}
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
            - name: Install dependencies
              run: yarn --frozen-lockfile
            - run: yarn build
            - name: Check if version already exists on npm
              id: npm_version_check
              shell: bash
              run: |
                  PKG_NAME=$(node -p "require('./package.json').name")
                  PKG_VERSION=$(node -p "require('./package.json').version")
                  if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
                    echo "Package ${PKG_NAME}@${PKG_VERSION} already published. Skipping publish."
                    echo "should_publish=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "Package ${PKG_NAME}@${PKG_VERSION} not found on npm. Publish enabled."
                    echo "should_publish=true" >> "$GITHUB_OUTPUT"
                  fi
            - name: Publish package (trusted publishing)
              if: steps.npm_version_check.outputs.should_publish == 'true'
              run: |
                  EXTRA_ARGS=""
                  if [ "${{ needs.check_if_version_upgraded.outputs.is_pre_release }}" = "true" ]; then
                    EXTRA_ARGS="--tag next"
                  fi
                  npm publish --access public --provenance $EXTRA_ARGS
              env:
                  NODE_AUTH_TOKEN: ""

